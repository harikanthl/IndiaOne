      (function () {
        const DUR = 5.669;
        const root = document.querySelector('[data-composition-id="03-intro"]');
        const q = (sel) => root.querySelector(sel);
        const tl = gsap.timeline({ paused: true });

        // Macro: a near-imperceptible push through the whole shot (static-frame variant).
        tl.fromTo(
          q("#intro03-stage"),
          { scale: 1.0 },
          { scale: 1.035, duration: DUR, ease: "none" },
          0
        );

        // Scene 1 — the zoom-through lands into darkness; jungle glow fades up; bushes rise.
        tl.fromTo(q("#intro03-glow"), { opacity: 0 }, { opacity: 0.5, duration: 1.1, ease: "power1.out" }, 0);
        tl.fromTo(
          q("#intro03-bush-left"),
          { y: 300, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          0.05
        );
        tl.fromTo(
          q("#intro03-bush-right"),
          { y: 300, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          0.15
        );

        // Scene 2 — on "Meet India Business One": lotus core scales up from 0.9,
        // the paisley ring spins in from -120deg to rest around it, a sun hairline
        // draws the ring's orbit, and the wordmark reveals per word on the VO.
        tl.fromTo(q("#intro03-bloom"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.2);
        tl.fromTo(
          q("#intro03-seal-core"),
          { scale: 0.9, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.15
        );
        tl.fromTo(
          q("#intro03-seal-ring"),
          { rotation: -120, scale: 1.14, opacity: 0 },
          { rotation: 0, scale: 1, opacity: 1, duration: 1.15, ease: "power3.out" },
          0.3
        );

        const guide = q("#intro03-guide-ring");
        const len = guide.getTotalLength() * 1.02;
        guide.style.strokeDasharray = String(len);
        guide.style.strokeDashoffset = String(len);
        tl.to(guide, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.4);
        tl.fromTo(guide, { opacity: 0.75 }, { opacity: 0.28, duration: 0.8, ease: "power1.out" }, 1.3);

        const wordCues = [
          ["#intro03-word-india", 0.52],
          ["#intro03-word-business", 0.82],
          ["#intro03-word-one", 1.17],
        ];
        wordCues.forEach(([sel, t]) => {
          tl.fromTo(
            q(sel),
            { y: 40, opacity: 0, filter: "blur(8px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
            t
          );
        });

        // Scene 3 — the ring keeps a slow, finite turn through the hold.
        tl.to(q("#intro03-seal-ring"), { rotation: 16, duration: DUR - 1.45, ease: "none" }, 1.45);

        // Tagline steps through its fragments as the VO says them (discrete-text-sequence:
        // whole-state replacement at time thresholds, instant swaps in place).
        const SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 2.0, text: "Every licence," },
          { t: 2.88, text: "every fee," },
          { t: 3.74, text: "every desk your file sits on." },
        ];
        const textAt = (time) => {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";
        };
        const tagEl = q("#intro03-tagline-text");
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: () => {
              tagEl.textContent = textAt(driver.t);
            },
          },
          0
        );

        // Tiger settles in lower right, behind the right bush.
        tl.fromTo(
          q("#intro03-tiger"),
          { x: 140, y: 30, opacity: 0 },
          { x: 0, y: 0, opacity: 1, duration: 1.1, ease: "power3.out" },
          2.35
        );

        // Peacock crosses right -> left (head first; the asset faces left) across the
        // upper third, once, with a gentle arc and wingbeat bob.
        const peacock = q("#intro03-peacock");
        const P_START = 2.0;
        const P_DUR = 3.4;
        const fly = { p: 0 };
        gsap.set(peacock, { x: 1980, y: 40, rotation: -4, opacity: 1 });
        tl.to(
          fly,
          {
            p: 1,
            duration: P_DUR,
            ease: "none",
            onUpdate: () => {
              const p = fly.p;
              const x = 1980 + (-500 - 1980) * p;
              const arc = 40 - Math.sin(p * Math.PI) * 34;
              const bob = Math.sin(p * Math.PI * 2 * 4) * 7;
              gsap.set(peacock, { x: x, y: arc + bob, rotation: -4 + p * 6 });
            },
          },
          P_START
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["03-intro"] = (function (inner) {
          // Time-warp: the voice-over was re-recorded; map the new spoken cue times back onto the original animation.
          var A = [[0, 0.0], [0.3, 0.326], [0.56, 1.163], [1.2, 1.946], [2.0, 2.641], [2.9, 3.707], [3.29, 4.033], [3.75, 4.5], [4.27, 4.728], [5.21, 5.793], [6.169, 7.247]];
          var OLD = 6.169, NEW = 7.247;
          function warp(tn) {
            for (var i = 1; i < A.length; i++) if (tn <= A[i][1]) { var a = A[i - 1], b = A[i]; return a[0] + ((tn - a[1]) * (b[0] - a[0])) / (b[1] - a[1]); }
            return OLD;
          }
          var outer = gsap.timeline({ paused: true });
          outer.add(inner.tweenFromTo(0, OLD, { duration: NEW, ease: function (p) { return warp(p * NEW) / OLD; } }), 0);
          return outer;
        })(tl);
      })();
