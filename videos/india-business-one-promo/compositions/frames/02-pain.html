    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "02-pain";
        var DURATION = 5.46;
        var scope = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
        var $ = function (id) {
          return scope.querySelector('[id="' + id + '"]');
        };
        var tl = gsap.timeline({ paused: true });

        var camera = $("f02-pain-camera");
        var line = $("f02-pain-line");
        var rule = $("f02-pain-rule");
        var card = $("f02-pain-card");
        var veil = $("f02-pain-veil");
        var stamp = $("f02-pain-stamp");
        var counter = $("f02-pain-counter");
        var group = $("f02-pain-count-group");
        var num = $("f02-pain-count-num");
        var sun = $("f02-pain-sun");
        var words = scope.querySelectorAll(".f02-pain-money .f02-pain-word");

        // ---------- Scene 1 (0.0–1.5s): stalled card floats in, the line types on the VO ----------
        tl.fromTo(
          card,
          { opacity: 0, y: 36 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          0,
        );
        tl.fromTo(veil, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        // slow float while the line types
        tl.fromTo(card, { y: 0 }, { y: -8, duration: 1.2, ease: "sine.inOut" }, 0.6);
        tl.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out" },
          0.15,
        );
        tl.fromTo(sun, { scale: 0.92, opacity: 0.7 }, { scale: 1.05, opacity: 1, duration: DURATION, ease: "none" }, 0);

        // typed line — characters land within each spoken word's window
        var typed = [
          { w: "My", s: 0.3, e: 0.43 },
          { w: "file", s: 0.47, e: 0.68 },
          { w: "sat", s: 0.81, e: 0.98 },
          { w: "on", s: 1.02, e: 1.11 },
          { w: "a", s: 1.15, e: 1.19 },
          { w: "desk.", s: 1.24, e: 1.55 },
        ];
        typed.forEach(function (t, wi) {
          var chars = t.w.split("");
          chars.forEach(function (ch, ci) {
            var span = document.createElement("span");
            span.textContent = ch;
            line.appendChild(span);
            var at = t.s + ((t.e - t.s) * ci) / Math.max(1, chars.length);
            tl.fromTo(span, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, at);
          });
          if (wi < typed.length - 1) line.appendChild(document.createTextNode(" "));
        });

        // ---------- Scene 2 (1.5–3.3s): DAY 1 → 21, size grows with the count ----------
        var COUNT_AT = 1.8;
        var COUNT_DUR = 1.5;
        var START_SCALE = 0.45;
        var state = { v: 1 };
        tl.fromTo(
          counter,
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power2.out" },
          COUNT_AT - 0.1,
        );
        tl.fromTo(veil, { opacity: 0 }, { opacity: 0.78, duration: 0.4, ease: "power2.out" }, COUNT_AT - 0.15);
        tl.fromTo(
          state,
          { v: 1 },
          {
            v: 21,
            duration: COUNT_DUR,
            ease: "power2.out",
            onUpdate: function () {
              num.textContent = String(Math.round(state.v));
            },
          },
          COUNT_AT,
        );
        tl.fromTo(
          group,
          { scale: START_SCALE },
          { scale: 1, duration: COUNT_DUR, ease: "power2.out" },
          COUNT_AT,
        );
        // past the 15-day published timeline the count turns ember (v crosses 15.5 at p≈0.476)
        tl.fromTo(
          counter,
          { color: "#1b2a57" },
          { color: "#b3261e", duration: 0.25, ease: "power1.out" },
          COUNT_AT + COUNT_DUR * 0.476,
        );

        // ---------- camera: one writer (multi-phase, steady push + push-THROUGH) ----------
        // Target: card centre (1300,460) lands at screen (960,410) at the end scale.
        var CX = 960, CY = 540, TX = 1300, TY = 460, LX = 960, LY = 410, END_S = 1.38;
        var cam = { s: 1, k: 0 };
        var drift = { p: 0 };
        var writeCam = function () {
          var tx = -(TX - CX) * cam.k;
          var tyEnd = (LY - CY) / END_S - (TY - CY);
          var ty = tyEnd * cam.k;
          var dx = Math.sin(drift.p) * 4;
          var dy = Math.sin(drift.p * 1.3) * 2;
          camera.style.transform =
            "scale(" + cam.s + ") translate(" + (tx + dx) + "px," + (ty + dy) + "px)";
        };
        // Phase 2: slow continuous push-in under the count
        tl.to(cam, { s: 1.06, k: 0.12, duration: 1.6, ease: "power1.inOut" }, 1.7);
        // Phase 3: push THROUGH the 21 into the card
        tl.to(cam, { s: END_S, k: 1, duration: 0.75, ease: "power3.inOut" }, 3.3);
        tl.fromTo(
          drift,
          { p: 0 },
          { p: Math.PI * 2 * 1.2, duration: DURATION, ease: "none", onUpdate: writeCam },
          0,
        );

        // the counter blows past the lens (element-level push-through: scale + blur + fade)
        tl.fromTo(
          counter,
          { scale: 1, opacity: 1, filter: "blur(0px)" },
          { scale: 3.6, opacity: 0, filter: "blur(18px)", duration: 0.55, ease: "power2.in", immediateRender: false },
          3.32,
        );
        // the veil lifts as we arrive inside the card; the typed line falls away behind
        tl.fromTo(veil, { opacity: 0.78 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 3.5);
        tl.fromTo(
          [line, rule],
          { opacity: 1, filter: "blur(0px)" },
          { opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in", immediateRender: false },
          3.3,
        );

        // ---------- Scene 3 (3.3–5.46s): stamp thuds on, the ask lands in ember ----------
        tl.fromTo(
          stamp,
          { scale: 1.7, opacity: 0, rotation: -12 },
          { scale: 1, opacity: 1, rotation: -7, duration: 0.32, ease: "power3.out" },
          3.82,
        );
        // restrained impact: the card takes the hit
        tl.fromTo(card, { scale: 1 }, { scale: 0.992, duration: 0.08, ease: "power2.out" }, 3.9);
        tl.to(card, { scale: 1, duration: 0.3, ease: "power3.out" }, 3.98);

        var wordAt = [4.01, 4.18, 4.48, 4.82, 4.95];
        words.forEach(function (w, i) {
          tl.fromTo(
            w,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
            wordAt[i],
          );
        });

        // pin the timeline to the full frame length
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = (function (inner) {
          // Time-warp: the voice-over was re-recorded; map the new spoken cue times back onto the original animation.
          var A = [[0, 0.0], [1.24, 1.674], [1.96, 2.37], [2.18, 2.641], [2.82, 3.337], [3.03, 3.522], [4.01, 4.457], [4.48, 4.87], [4.95, 5.337], [5.86, 6.777]];
          var OLD = 5.86, NEW = 6.777;
          function warp(tn) {
            for (var i = 1; i < A.length; i++) if (tn <= A[i][1]) { var a = A[i - 1], b = A[i]; return a[0] + ((tn - a[1]) * (b[0] - a[0])) / (b[1] - a[1]); }
            return OLD;
          }
          var outer = gsap.timeline({ paused: true });
          outer.add(inner.tweenFromTo(0, OLD, { duration: NEW, ease: function (p) { return warp(p * NEW) / OLD; } }), 0);
          return outer;
        })(tl);
      })();
    </script>
