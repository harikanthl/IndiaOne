            <polygon data-hf-id="hf-rqcc" id="f04-address-ward-fill" points="1168,324 1329,314 1360,465 1188,475" fill="#F2B33D" opacity="0" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "04-address";
        var DUR = 4.571;
        var byId = function (s) {
          return document.getElementById("f" + ID + "-" + s);
        };
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var q = function (sel) {
          return Array.prototype.slice.call(root.querySelectorAll(sel));
        };

        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1: card establishes (visible by 0.5s) ----
        tl.fromTo(byId("card-enter"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

        // coordinate-target-zoom (nested wrappers: outer scales, inner counter-translates).
        // Target = sheet field+rows, native (1286, 495) -> canvas (1204.5, 436.25) after the 0.75 card scale.
        // Offset from canvas centre = (244.5, -103.75). Land it at y=450 (above caption keep-out): T = -offset + (0, -90/S).
        var S1 = 2.3;
        var S2 = 2.42;
        tl.fromTo(byId("cam-outer"), { scale: 1 }, { scale: S1, duration: 1.0, ease: "power3.inOut" }, 0.15);
        tl.fromTo(byId("cam-inner"), { x: 0, y: 0 }, { x: -244.5, y: 103.75 - 90 / S1, duration: 1.0, ease: "power3.inOut" }, 0.15);
        // While zooming, clip the screenshot to the address sheet so the hero headline never shows half-cropped.
        tl.fromTo(byId("card"), { clipPath: "inset(0px 0px 0px 0px round 0px)" }, { clipPath: "inset(190px 400px 150px 1050px round 14px)", duration: 1.0, ease: "power3.inOut" }, 0.15);
        // Scene 2: slow follow-push down the rows (target drifts to native y 530 -> offset y -77.5)
        tl.to(byId("cam-outer"), { scale: S2, duration: 2.4, ease: "sine.inOut" }, 1.15);
        tl.to(byId("cam-inner"), { y: 77.5 - 90 / S2, duration: 2.4, ease: "sine.inOut" }, 1.15);

        // ---- Scene 3: scale-swap to the ward map ----
        var TRIGGER = 3.62;
        var EXIT_DUR = 0.32;
        var OVERLAP = 0.14;
        tl.fromTo(byId("swap-out"), { scale: 1, opacity: 1 }, { scale: 0.72, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);
        tl.fromTo(byId("swap-in"), { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, TRIGGER + EXIT_DUR - OVERLAP);
        tl.fromTo(byId("map"), { scale: 1 }, { scale: 1.03, duration: DUR - (TRIGGER + EXIT_DUR - OVERLAP), ease: "sine.out" }, TRIGGER + EXIT_DUR - OVERLAP);

        // ---- One linear driver: typing, caret, row resolve, asr-keyword-glow envelopes ----
        var ADDRESS = "Plot 14, Road No. 36, Madhapur, Hyderabad";
        var TYPE_START = 0.3;
        var TYPE_END = 1.1;
        var ROW_AT = [1.4, 1.62, 2.43, 3.33, 3.46];
        var GLOW = {
          corp: { start: 2.43, end: 3.09 },
          zone: { start: 3.33, end: 3.58 },
        };
        var WARD = { start: 3.97, end: 4.32 };
        var ATTACK = 0.12;
        var RELEASE = 0.35;
        var REST = 0.15;
        var MAX_BLUR = 18;
        var MAX_SCALE = 0.14;

        function envelope(t, start, end, attack, release, rest) {
          if (t < start) return 0;
          if (t < end) return Math.min((t - start) / attack, 1);
          if (t < end + release) return 1 - ((t - end) / release) * (1 - rest);
          return rest;
        }
        function mix(a, b, k) {
          return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * k) + "," + Math.round(a[1] + (b[1] - a[1]) * k) + "," + Math.round(a[2] + (b[2] - a[2]) * k) + ")";
        }
        var VAL_FADE = [206, 205, 205];
        var LAB_FADE = [216, 214, 211];
        var INK_SITE = [31, 28, 25];
        var LAB_ON = [133, 127, 120];

        var typedEl = byId("typed-text");
        var caretEl = byId("caret");
        var vals = q(".f04-address-val");
        var labs = q('.f04-address-lab, .f04-address-meta');
        var tiles = { corp: byId("tile-corp"), zone: byId("tile-zone") };
        var wardFill = byId("ward-fill");
        var wardHalo = byId("ward-halo");

        function render(t) {
          // typing (discrete threshold reveal)
          var k = Math.max(0, Math.min(1, (t - TYPE_START) / (TYPE_END - TYPE_START)));
          var n = Math.floor(k * ADDRESS.length + 1e-6);
          typedEl.textContent = ADDRESS.slice(0, n);
          var typing = t >= TYPE_START - 0.1 && t < TYPE_END;
          caretEl.style.opacity = typing ? 1 : Math.floor(t / 0.42) % 2 === 0 ? 1 : 0;

          // rows resolve top to bottom
          vals.forEach(function (el) {
            var r = +el.dataset.row;
            var on = Math.max(0, Math.min(1, (t - ROW_AT[r]) / 0.14));
            var g = el.dataset.glow;
            var env = g ? envelope(t, GLOW[g].start, GLOW[g].end, ATTACK, RELEASE, REST) : 0;
            el.style.color = mix(VAL_FADE, INK_SITE, on);
            el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(242,179,61," + (0.95 * env).toFixed(3) + ")";
            el.style.transform = "scale(" + (1 + MAX_SCALE * env).toFixed(4) + ")";
            if (g) tiles[g].style.opacity = (0.55 * env).toFixed(3);
          });
          labs.forEach(function (el) {
            var r = +el.dataset.row;
            var on = Math.max(0, Math.min(1, (t - ROW_AT[r]) / 0.14));
            el.style.color = mix(LAB_FADE, LAB_ON, on);
          });

          // Ward 104 marigold glow on the map
          var we = envelope(t, WARD.start, WARD.end, 0.2, 0.4, 0.6);
          wardFill.setAttribute("opacity", (0.55 * we).toFixed(3));
          wardHalo.setAttribute("opacity", (0.7 * we).toFixed(3));
        }

        var driver = { t: 0 };
        tl.fromTo(
          driver,
          { t: 0 },
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              render(driver.t);
            },
          },
          0
        );
        render(0);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = (function (inner) {
          // Time-warp: the voice-over was re-recorded; map the new spoken cue times back onto the original animation.
          var A = [[0, 0.0], [0.26, 0.467], [0.68, 1.304], [1.36, 1.859], [2.43, 2.783], [3.33, 3.946], [3.97, 4.826], [5.071, 6.509]];
          var OLD = 5.071, NEW = 6.509;
          function warp(tn) {
            for (var i = 1; i < A.length; i++) if (tn <= A[i][1]) { var a = A[i - 1], b = A[i]; return a[0] + ((tn - a[1]) * (b[0] - a[0])) / (b[1] - a[1]); }
            return OLD;
          }
          var outer = gsap.timeline({ paused: true });
          outer.add(inner.tweenFromTo(0, OLD, { duration: NEW, ease: function (p) { return warp(p * NEW) / OLD; } }), 0);
          return outer;
        })(tl);
      })();
    </script>
